# Called by pr.yml on every pull request that is not documentation only;
# dispatch it to run it on a branch without a pull request.
name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.8.0
    with:
      # otfabric-policy runs in docs.yml, on every pull request and push to main.
      run-policy: false
      run-govulncheck: true
      fuzz-time: 10s
      coverage-min: "90"
      codecov-name: profinetctl
      go-versions: '["1.26", "1.27"]'
      # Test the cmd packages as well (the shared default skips /cmd) and attribute
      # coverage across the whole module, matching `make coverage`.
      test-exclude-regex: "/example(s)?($|/)"
      coverpkg: ./...
    secrets: inherit

  # The shared workflow gates the total; this job gates each package.
  coverage-floor:
    name: Per-package coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make coverage-pkg-check

  # RELEASE.md in the format the shared release workflow reads: without
  # it a release body is a commit log.
  release-notes:
    name: Release notes format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: make release-notes-check

  # The binary-level suite (TEST-008): make e2e builds profinetctl and runs it. The
  # interrupt cases listen on one end of a veth pair, with CAP_NET_RAW on the binary;
  # no frame leaves the runner.
  e2e:
    name: End-to-end tests (the built binary)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: A veth pair to listen on
        run: |
          sudo ip link add pne2e0 type veth peer name pne2e1
          sudo ip link set pne2e0 up
          sudo ip link set pne2e1 up
      - run: make e2e E2E_SETCAP=1
        env:
          PROFINETCTL_E2E_INTERFACE: pne2e0

  # The shared workflow builds for 64-bit only; linux/arm/v7 is a release target, where int
  # has 32 bits.
  cross:
    name: Typecheck for 32-bit targets, build every release target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make cross
      - run: make build-all
