name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.2.0
    with:
      run-govulncheck: true
      fuzz-time: 10s
      coverage-min: "90"
      codecov-name: profinetctl
      go-versions: '["1.25", "1.26"]'
      # Test the cmd packages as well (the shared default skips /cmd) and attribute
      # coverage across the whole module, matching `make coverage`.
      test-exclude-regex: "/example(s)?($|/)"
      coverpkg: ./...
    secrets: inherit

  # The shared workflow gates the total; this job gates each package.
  coverage-floor:
    name: Per-package coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make coverage-pkg-check

  # RELEASE.md in the format the shared release workflow reads: without
  # it a release body is a commit log.
  release-notes:
    name: Release notes format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: make release-notes-check

  # The shared workflow builds for 64-bit only; linux/arm/v7 is a release target, where int
  # has 32 bits.
  cross:
    name: Typecheck for 32-bit targets, build every release target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make cross
      - run: make build-all
